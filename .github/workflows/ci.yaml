name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v.7.1.0
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip==26.3

      - run: python -m pip install -e ".[dev]"

      - run: python -m pytest

      - run: ruff check .

      - run: black --check .

      - run: mypy src

      - name: Scan source for security issues
        run: python -m bandit -r src

      - name: Export resolved dependencies for audit
        run: python -m pip freeze --all --exclude-editable > /tmp/mail-analyzer-audit-requirements.txt

      - name: Audit dependency vulnerabilities
        run: python -m pip_audit --strict --requirement /tmp/mail-analyzer-audit-requirements.txt