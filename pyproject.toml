[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-analyzer"
version = "0.1.0"
description = "Read-only Outlook Mailbox Analyzer"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "click==8.5.1",
    "cryptography==50.0.2",
    "msal==1.39.0",
    "requests==2.34.2",
    "sqlalchemy==2.0.36",
    "python-dotenv==1.2.4",
    "typer==0.15.1",
    "jinja2==3.1.6",
    "pandas==2.2.3",
]

[project.optional-dependencies]

dev = [
    "pytest==9.2.0",
    "pytest-mock==3.14.0",
    "black==26.10.1",
    "ruff==0.8.4",
    "mypy==1.14.1",
    "setuptools==84.2.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = 3.12

warn_unused_configs = true

disallow_untyped_defs = true

check_untyped_defs = true

[project.scripts]

mail-analyzer = "mail_analyzer.cli:app"
